---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ots-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ots-redis
  labels:
    app: ots-redis
    role: leader
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ots-redis
  template:
    metadata:
      labels:
        app: ots-redis
        role: leader
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: ots-redis
      containers:
        - name: leader
          image: docker.io/valkey/valkey:9.1.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 256Mi
          ports:
            - containerPort: 6379
          volumeMounts:
            - mountPath: /data
              name: redis-storage
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ots-redis
  labels:
    app: ots-redis
    role: leader
    tier: backend
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: ots-redis
    role: leader
    tier: backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ots-customize
data:
  customize.yml: |
    appTitle: "My very customized OTS"
    disableQRSupport: true
    maxAttachmentSizeTotal: 1048576
    maxSecretSize: 2097152
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ots
      tier: frontend
  template:
    metadata:
      labels:
        app: ots
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: custom
          configMap:
            name: ots-customize
      containers:
        - name: ots
          image: ghcr.io/luzifer/ots:v1.21.8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          args:
            - --storage-type
            - redis
            - --customize
            - /custom/customize.yml
          env:
            - name: REDIS_URL
              value: tcp://ots-redis:6379
            - name: REDIS_KEY
              value: ots
            - name: SECRET_EXPIRY
              value: "172800"
          volumeMounts:
            - mountPath: /custom
              name: custom
          resources:
            limits:
              memory: 32Mi
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ots
  labels:
    app: ots
    tier: frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: ots
    tier: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ots
spec:
  ingressClassName: nginx
  rules:
    - host: ots.example.com
      http:
        paths:
          - backend:
              service:
                name: ots
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ots.example.com
      secretName: ots-ingress-tls
