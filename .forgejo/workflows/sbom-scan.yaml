name: SBOM Scan

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  sbom-scan:
    runs-on: forgejo

    steps:
      - uses: Luzifer/actions/dependencytrack-scan@207fd028b122b60f8218cbfff0cb7401d55f29a1 # develop
        with:
          token: ${{ secrets.DT_TOKEN }}
          url: https://dt.hub.luzifer.io
