name: docker-publish

on:
  push:
    branches: ['master']
    tags: ['v*']

jobs:
  docker-publish:
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1.18.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      fail-fast: true
      sbom: true
      sign: 'true'
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=develop,enable=${{ github.ref == 'refs/heads/master' }}
        type=ref,event=tag
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
