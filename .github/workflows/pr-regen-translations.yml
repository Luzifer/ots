name: generate-translations

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/regen-translations')

    outputs:
      authorized: ${{ steps.pr.outputs.authorized }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha }}

    permissions:
      contents: read
      pull-requests: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check commenter permission and PR metadata
        id: pr
        run: node .github/scripts/translate-gate.ts
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}

  generate-translations:
    if: needs.gate.outputs.authorized == 'true'
    needs: [gate]

    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/luzifer-docker/action-env:2026.32.0@sha256:5a9c352c4decd8be813f9a8539f464ae255a48e04317f9942d412468a1932b2b
      env:
        CGO_ENABLED: 0
        GOPATH: /go

    permissions:
      contents: write
      packages: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.gate.outputs.head_repo }}
          ref: ${{ needs.gate.outputs.head_ref }}

      - name: Marking workdir safe
        run: git config --global --add safe.directory /__w/ots/ots

      - name: Verify checked-out PR head
        run: |
          set -euo pipefail

          if [[ $(git rev-parse HEAD) != "${EXPECTED_SHA}" ]]; then
            echo "Checked-out HEAD does not match approved PR head SHA" >&2
            exit 1
          fi
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.head_sha }}

      - name: Fetch translation utility
        run: |
          oras pull ${TRANSLATE_IMG}
          chmod +x translate
        env:
          TRANSLATE_IMG: ghcr.io/luzifer/ots/translate-util:latest@sha256:2de5905cd3d901a7e19df3fa299175e8e93eba0c783ef3ae0122add66382b668

      - name: Re-Generate embedded translations file
        run: ./translate

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          commit_message: 'CI: Update embedded translations'
          file_pattern: 'src/langs/langs.js'
