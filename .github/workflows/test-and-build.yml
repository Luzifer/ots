name: test-and-build
on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-and-build:
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/luzifer-docker/action-env:2026.45.0@sha256:9845126314d3eeaa74d0cda1ae40fc23aadda9606cd7bed07b9f9cfc305e0790
      env:
        CGO_ENABLED: 0
        GOPATH: /go

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Marking workdir safe
        run: git config --global --add safe.directory /__w/ots/ots

      - name: Initialize Go Workspace
        run: |
          go work init
          find . -name 'go.mod' | xargs dirname | xargs go work use

      - name: Run golangci-lint
        run: |
          golangci-lint run $(go list -f "{{.Dir}}/..." -m)

      - name: Run go test
        run: |
          go list -m | xargs go test -v -cover

      - name: Fetch translation utility
        run: |
          oras pull ${TRANSLATE_IMG}
          chmod +x translate
        env:
          TRANSLATE_IMG: ghcr.io/luzifer/ots/translate-util:latest@sha256:390b1aa2953f8b6704fac1010951f6a62a8b2329ba9382457339be1d41c1e0d7

      - name: Generate (and validate) translations
        run: ./translate

      - name: Build release
        run: make publish
        env:
          FORCE_SKIP_UPLOAD: 'true'
          MOD_MODE: readonly
          NO_TESTS: 'true'
          PACKAGES: '.'

      - name: Execute Trivy scan
        run: make trivy

      - name: Extract changelog
        run: 'awk "/^#/ && ++c==2{exit}; /^#/f" "History.md" | tail -n +2 >release_changelog.md'

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: '.build/*'
          bodyFile: release_changelog.md
          draft: false
          generateReleaseNotes: false
