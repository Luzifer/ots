---
name: test-and-build
on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write
  issues: write

jobs:
  test-and-build:
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/luzifer-docker/action-env:2026.34.2@sha256:54ea1200ddf296553fa259709f2b6997eb20c23331c2e74d80586845422a0117
      env:
        CGO_ENABLED: 0
        GOPATH: /go

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Marking workdir safe
        run: git config --global --add safe.directory /__w/ots/ots

      - name: Initialize Go Workspace
        run: |
          go work init
          find . -name 'go.mod' | xargs dirname | xargs go work use

      - name: Run golangci-lint
        run: |
          golangci-lint run $(go list -f "{{.Dir}}/..." -m)

      - name: Run go test
        run: |
          go list -m | xargs go test -v -cover

      - name: Fetch translation utility
        run: |
          oras pull ${TRANSLATE_IMG}
          chmod +x translate
        env:
          TRANSLATE_IMG: ghcr.io/luzifer/ots/translate-util:latest@sha256:e78cece4ddb99b0a6f87dd5b7964723d09fc280670eb7871352eee2ae0db2f42

      - name: Generate (and validate) translations
        run: ./translate --write-issue-file

      - name: Delete issue template when no languages require translation
        run: |
          grep -q "### Language" translate-issue.md || rm -f translate-issue.md

      - name: Update Translations Issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        if: github.ref == 'refs/heads/master' && hashFiles('translate-issue.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: translate-issue.md
          update_existing: true

      - name: Build release
        run: make publish
        env:
          FORCE_SKIP_UPLOAD: 'true'
          MOD_MODE: readonly
          NO_TESTS: 'true'
          PACKAGES: '.'

      - name: Execute Trivy scan
        run: make trivy

      - name: Extract changelog
        run: 'awk "/^#/ && ++c==2{exit}; /^#/f" "History.md" | tail -n +2 >release_changelog.md'

      - name: Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: '.build/*'
          bodyFile: release_changelog.md
          draft: false
          generateReleaseNotes: false
